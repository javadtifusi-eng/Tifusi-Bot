name: Tests

# The money paths (wallet spend and refunds, receipt approval, pending
# purchases, Free Pass, direct card-to-card orders) and the Mini App's
# signed API, against fakes for Telegram and the panel: tests/.
on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
