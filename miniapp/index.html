<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tifusi</title>
<style>
@font-face{font-family:"Vazirmatn";src:url("assets/Vazirmatn-Regular.woff2") format("woff2");font-weight:300 599;font-display:swap}
@font-face{font-family:"Vazirmatn";src:url("assets/Vazirmatn-Bold.woff2") format("woff2");font-weight:600 900;font-display:swap}
.empty{color:var(--muted);text-align:center;padding:24px 8px;line-height:1.9}
.loading{display:grid;place-items:center;min-height:40vh;color:var(--muted)}
.soon{font-size:.72rem;color:var(--muted);text-align:center}

/* Layout: phone-width shell (max 440px), glass cards on a deep lapis night with Persepolis columns; floating glass tab bar. Dark-first, light variant for light Telegram themes. Latin digits everywhere. */
:root{
  --bg:#050b1f; --bg2:#0b1d4a; --fg:#eaf2ff; --muted:#8fa3c8; --soft:#5f7398;
  --glass:rgba(40,90,190,.14); --glass2:rgba(255,255,255,.05); --edge:rgba(120,180,255,.28); --edge2:rgba(255,255,255,.10);
  --shadow:rgba(0,0,0,.55); --glow:rgba(63,208,216,.45);
  --cyan:#3fd0e0; --cyan2:#22b7d6; --lapis:#1d3f8f; --navy:#10265e;
  --ok:#3fcf8e; --warn:#f2c14e; --bad:#9aa6bd; --track:rgba(255,255,255,.12);
  --col:rgba(120,160,230,.10);
  --font:"Vazirmatn",Tahoma,sans-serif; color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef4fb; --bg2:#d9e6f7; --fg:#0f2347; --muted:#5a6d8e; --soft:#8796b0;
  --glass:rgba(255,255,255,.72); --glass2:rgba(255,255,255,.55); --edge:rgba(29,63,143,.16); --edge2:rgba(29,63,143,.08);
  --shadow:rgba(16,38,94,.14); --glow:rgba(34,183,214,.35);
  --cyan:#1fb6d4; --cyan2:#1597bd; --lapis:#1d3f8f; --navy:#1d3f8f;
  --ok:#14915a; --warn:#d49a12; --bad:#8a96ab; --track:rgba(15,35,71,.10);
  --col:rgba(29,63,143,.07); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef4fb; --bg2:#d9e6f7; --fg:#0f2347; --muted:#5a6d8e; --soft:#8796b0;
  --glass:rgba(255,255,255,.72); --glass2:rgba(255,255,255,.55); --edge:rgba(29,63,143,.16); --edge2:rgba(29,63,143,.08);
  --shadow:rgba(16,38,94,.14); --glow:rgba(34,183,214,.35);
  --cyan:#1fb6d4; --cyan2:#1597bd; --lapis:#1d3f8f; --navy:#1d3f8f;
  --ok:#14915a; --warn:#d49a12; --bad:#8a96ab; --track:rgba(15,35,71,.10);
  --col:rgba(29,63,143,.07); color-scheme:light}
*{box-sizing:border-box}
body{background:radial-gradient(700px 420px at 50% -8%,var(--bg2),transparent 70%),var(--bg);color:var(--fg);font-family:var(--font);direction:rtl;min-height:100vh;font-variant-numeric:lining-nums}
.app{max-width:440px;margin:0 auto;padding-inline:16px;padding-block:10px 112px;display:grid;gap:14px;position:relative}
.cols{position:fixed;inset:auto 0 0 0;height:46vh;max-width:440px;margin:0 auto;pointer-events:none;z-index:-1;opacity:1}
.glass{background:linear-gradient(160deg,var(--glass),var(--glass2));border:1px solid var(--edge);border-radius:22px;box-shadow:inset 0 1px 0 var(--edge2),0 12px 30px var(--shadow);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
/* header */
.bar{display:flex;justify-content:space-between;align-items:center}
.iconbtn{appearance:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--fg);background:var(--glass);border:1px solid var(--edge);cursor:pointer;position:relative}
.iconbtn .badge{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:#ff5d6c;box-shadow:0 0 0 2px var(--bg)}
.iconbtn:focus-visible,.pill:focus-visible,.cta:focus-visible,.tile:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.brand{display:grid;justify-items:center;gap:4px;margin-top:-26px}
.brand img{width:170px;height:auto;filter:drop-shadow(0 8px 24px rgba(63,208,224,.25))}
.brand .en{font-size:.95rem;letter-spacing:.6em;font-weight:700;color:var(--fg);margin-inline-start:.6em;direction:ltr}
.ptitle{text-align:center;display:grid;gap:2px;position:relative}
.ptitle b{font-size:1.15rem}
.ptitle small{color:var(--muted);font-size:.78rem}
.ptitle .iconbtn{position:absolute;top:0;left:0;width:34px;height:34px;background:none;border:0}
.ptitle .back{right:0;left:auto;width:auto;height:34px;padding:0 10px 0 12px;gap:4px;display:flex;align-items:center;border-radius:999px;background:rgba(255,255,255,.14)!important;border:1px solid rgba(255,255,255,.3)!important;box-shadow:none!important;font:inherit;font-size:.8rem;color:#fff}
.ptitle .back svg{width:16px;height:16px}
/* wallet */
.wallet{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px}
.wallet .w{flex:1 1 100%;min-width:0}
.wallet .v{overflow-wrap:anywhere}
.wallet>.pill{flex:1 1 100%;justify-content:center}
.wallet .w{display:flex;gap:12px;align-items:center}
.wicon{width:52px;height:44px;border-radius:12px;background:linear-gradient(160deg,#dfe8f7,#9fb2d4);position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.wicon::after{content:"";position:absolute;left:-4px;top:15px;width:18px;height:14px;border-radius:5px;background:#c3d0e8;box-shadow:inset 0 0 0 2px #8ea3c8}
.wallet .k{color:var(--muted);font-size:.8rem}
.wallet .v{font-size:1.45rem;font-weight:800}
.wallet .v small{font-size:.8rem;color:var(--muted);font-weight:500}
.pill{appearance:none;border:0;font:inherit;font-weight:700;font-size:.85rem;color:#04223a;background:linear-gradient(180deg,#7fe8f2,var(--cyan));padding:10px 16px;border-radius:999px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;box-shadow:0 6px 20px var(--glow);white-space:nowrap}
.pill.dark{background:linear-gradient(180deg,#2b56c4,var(--lapis));color:#fff;box-shadow:0 6px 16px rgba(29,63,143,.45)}
.pill.ghost{background:var(--glass);color:var(--fg);border:1px solid var(--edge);box-shadow:none}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{appearance:none;font:inherit;color:var(--fg);text-align:center;padding:14px 6px;display:grid;justify-items:center;gap:4px;cursor:pointer}
.tile .ic{width:24px;height:24px;color:var(--cyan)}
.tile b{font-size:1.5rem;font-weight:800}
.tile small{color:var(--muted);font-size:.75rem}
.cta{appearance:none;border:0;width:100%;font:inherit;font-size:1.02rem;font-weight:800;color:#04223a;padding:16px;border-radius:20px;display:flex;justify-content:center;gap:8px;align-items:center;cursor:pointer;
  background:linear-gradient(180deg,#86ecf5,var(--cyan) 55%,var(--cyan2));box-shadow:0 10px 30px var(--glow),inset 0 1px 0 rgba(255,255,255,.6)}
/* lists */
.sec{padding:14px}
.sech{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sech b{font-size:.95rem}
.sech button{appearance:none;background:none;border:0;color:var(--cyan);font:inherit;font-size:.78rem;cursor:pointer}
.lrow{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--edge2);font-size:.88rem}
.lrow:last-child{border-bottom:0}
.lrow .u{display:flex;gap:8px;align-items:center;direction:ltr}
.lrow .u .ic{width:16px;height:16px;color:var(--muted)}
.lrow .d{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.8rem}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}.dot.bad{background:var(--bad)}.dot.info{background:#4a8cff;box-shadow:0 0 8px #4a8cff}
/* customers */
.search{display:flex;gap:8px;align-items:center;padding:12px 14px;border-radius:16px}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;outline:none}
.search .ic{color:var(--muted)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.filters button{appearance:none;font:inherit;font-size:.8rem;font-weight:700;padding:9px 16px;border-radius:999px;border:1px solid var(--edge);background:var(--glass);color:var(--fg);cursor:pointer;white-space:nowrap}
.filters button[aria-pressed="true"]{background:linear-gradient(180deg,#2b56c4,var(--lapis));color:#fff;border-color:transparent}
.cust{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 14px}
.cust .nm{direction:ltr;text-align:right;font-weight:700;font-size:.92rem}
.cust .mt{color:var(--muted);font-size:.76rem;line-height:1.7;display:flex;gap:6px;align-items:center}
.cacts{display:flex;gap:6px}
.cacts .pill{padding:7px 13px;font-size:.78rem}
.chev{color:var(--soft)}
/* buy */
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kind{appearance:none;font:inherit;color:var(--fg);padding:16px 10px;display:grid;justify-items:center;gap:6px;text-align:center;cursor:pointer;border-radius:20px}
.kind .ic{width:30px;height:30px}
.kind b{font-size:1rem}
.kind small{color:var(--muted);font-size:.72rem}
.kind[aria-pressed="true"]{background:linear-gradient(160deg,rgba(63,208,224,.55),rgba(29,140,190,.35));border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 10px 30px var(--glow)}
.kind[aria-pressed="true"] small{color:var(--fg)}
.h2{display:grid;gap:2px;margin-top:4px}
.h2 b{font-size:1rem}.h2 small{color:var(--muted);font-size:.75rem}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.plan{appearance:none;font:inherit;color:var(--fg);display:grid;justify-items:center;gap:4px;padding:14px 6px;cursor:pointer;text-align:center}
.plan .ic{color:var(--cyan);width:22px;height:22px}
.plan .gb{font-size:1.15rem;font-weight:800}
.plan .gb small{font-size:.8rem;font-weight:700}
.plan .pr{font-size:.82rem;font-weight:700}
.plan .dy{font-size:.7rem;color:var(--muted)}
.plan[aria-pressed="true"]{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 10px 26px var(--glow)}
/* wallet page */
.bigw{padding:18px;display:grid;gap:12px}
.bigw .top{display:flex;justify-content:space-between;align-items:center}
.bigw .v{font-size:1.7rem;font-weight:800}
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.amts button{appearance:none;font:inherit;font-weight:700;font-size:.74rem;white-space:nowrap;padding:11px 4px;border-radius:999px;border:1px solid var(--edge);background:var(--glass);color:var(--fg);cursor:pointer}
.amts button[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
.cardno{padding:14px;display:grid;gap:10px}
.cardno .n{font-size:1.25rem;font-weight:800;letter-spacing:.06em;display:flex;gap:10px;align-items:center;justify-content:flex-end}
.cardno .n button{appearance:none;background:none;border:0;color:var(--muted);cursor:pointer;padding:0}
.upl{display:flex;justify-content:center;gap:8px;align-items:center;padding:11px;border-radius:14px;border:1px dashed var(--edge);color:var(--fg);font-size:.85rem;cursor:pointer}
.tx{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--edge2)}
.tx:last-child{border-bottom:0}
.tx .ti{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--edge);color:var(--cyan)}
.tx .ti .ic{width:16px;height:16px}
.tx b{font-size:.85rem;display:block}.tx small{color:var(--muted);font-size:.72rem}
.tx .am{font-weight:800;font-size:.85rem}
.tx .am.plus{color:var(--ok)}.tx .am.minus{color:var(--muted)}
/* service card */
.svc{padding:18px;display:grid;gap:14px;background:radial-gradient(260px 160px at 85% 0%,rgba(63,208,224,.25),transparent 70%),linear-gradient(160deg,var(--glass),var(--glass2))}
.svctop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.svctop>div{min-width:0}
.ring{width:118px;height:118px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.25}
.ring .c b{font-size:1.35rem}
.ring .c small{font-size:.7rem;color:var(--muted)}
.svc h3{margin:0;font-size:1.1rem;overflow-wrap:anywhere}
.svc .pl{color:var(--muted);font-size:.82rem;margin:4px 0 8px}
.chips{display:flex;gap:6px}
.chip{font-size:.75rem;font-weight:700;padding:5px 12px;border-radius:10px;background:var(--glass);border:1px solid var(--edge);direction:ltr}
.days{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.dbar{height:7px;border-radius:7px;background:var(--track);overflow:hidden}
.dbar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--cyan2),#86ecf5);box-shadow:0 0 12px var(--glow)}
.sacts{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}
.sacts .pill{justify-content:center}
.info .lrow .d{color:var(--muted)}
.info .lrow .v{direction:ltr;font-weight:600}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-width:408px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:7px;border-radius:26px;z-index:10}
.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:.68rem;font-weight:700;display:grid;justify-items:center;gap:3px;padding:8px 0;border-radius:18px;cursor:pointer}
.tabs button[aria-selected="true"]{color:#fff;background:linear-gradient(180deg,rgba(63,208,224,.55),rgba(29,63,143,.65));box-shadow:0 0 18px var(--glow)}
:root[data-theme="light"] .tabs button[aria-selected="true"]{color:#fff}
.tabs button:focus-visible{outline:2px solid var(--cyan)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset:auto 0 0 0;max-width:440px;margin:0 auto;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;z-index:20;transform:translateY(110%);transition:transform .25s ease;display:grid;gap:12px;background:var(--bg);border:1px solid var(--edge)}
.sheet.open{transform:none}
.sheet h3{margin:0}
.sheetx{position:sticky;top:0;justify-self:end;margin:-6px -4px -40px 0;z-index:2;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);cursor:pointer}
.sheetx svg{width:16px;height:16px;display:block}
.sheet h3{padding-inline-end:44px}
.field{display:grid;gap:6px;font-size:.8rem;color:var(--muted)}
.field input{font:inherit;padding:12px;border-radius:14px;border:1px solid var(--edge);background:var(--glass);color:var(--fg);direction:ltr}
.stepper{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.stepper output{text-align:center;font-weight:800;font-size:1.1rem}
.sum{display:grid;gap:6px;font-size:.9rem}
.sum div{display:flex;justify-content:space-between}
.sum span:last-child{font-weight:700}
.toast{position:fixed;top:calc(14px + max(var(--tg-top,0px), env(safe-area-inset-top,0px)));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.tag{position:fixed;top:8px;left:8px;font-size:.65rem;padding:4px 9px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);color:var(--muted);z-index:5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- glossy pass: closer to the approved GPT mockup ---- */
:root{--g1:rgba(40,96,210,.50);--g2:rgba(8,22,64,.78);--rim:rgba(120,190,255,.55);--rimsoft:rgba(120,190,255,.18);--sheen2:rgba(255,255,255,.16);--halo:rgba(60,140,255,.22)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--g1:rgba(255,255,255,.92);--g2:rgba(232,241,252,.82);--rim:rgba(29,63,143,.22);--rimsoft:rgba(29,63,143,.08);--sheen2:rgba(255,255,255,.7);--halo:rgba(34,120,214,.10)}}
:root[data-theme="light"]{--g1:rgba(255,255,255,.92);--g2:rgba(232,241,252,.82);--rim:rgba(29,63,143,.22);--rimsoft:rgba(29,63,143,.08);--sheen2:rgba(255,255,255,.7);--halo:rgba(34,120,214,.10)}
body{background:
  radial-gradient(520px 340px at 50% 6%,rgba(40,110,255,.38),transparent 70%),
  radial-gradient(1.2px 1.2px at 12% 8%,rgba(255,255,255,.7),transparent 2px),radial-gradient(1px 1px at 78% 5%,rgba(255,255,255,.6),transparent 2px),
  radial-gradient(1px 1px at 64% 15%,rgba(255,255,255,.5),transparent 2px),radial-gradient(1.4px 1.4px at 30% 18%,rgba(255,255,255,.55),transparent 2px),
  radial-gradient(1px 1px at 90% 22%,rgba(255,255,255,.5),transparent 2px),
  linear-gradient(180deg,var(--bg2) 0%,var(--bg) 55%)}
.glass{position:relative;overflow:hidden;background:linear-gradient(165deg,var(--g1),var(--g2));border:1px solid var(--rim);
  box-shadow:inset 0 1px 0 var(--sheen2),inset 0 0 26px var(--rimsoft),0 0 22px var(--halo),0 16px 34px var(--shadow)}
.glass::before{content:"";position:absolute;inset:0 0 58% 0;background:linear-gradient(180deg,var(--sheen2),transparent);pointer-events:none;border-radius:inherit}
.glass>*{position:relative}
.hero{position:relative;display:grid;justify-items:center;padding-top:6px;margin-top:-30px}
.hero svg.ruins{position:absolute;inset:-10px -16px auto -16px;width:calc(100% + 32px);height:210px;z-index:0}
.hero img{position:relative;z-index:1;width:190px;filter:drop-shadow(0 0 18px rgba(120,190,255,.45)) drop-shadow(0 10px 20px rgba(0,0,0,.5))}
.hero .en{position:relative;z-index:1;font-size:1rem;letter-spacing:.7em;font-weight:800;margin-top:2px;direction:ltr;text-shadow:0 0 14px rgba(120,190,255,.6)}
.pill{position:relative;overflow:hidden;background:linear-gradient(180deg,#a6f6ff 0%,#4fdcf0 45%,#1fb3d8 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 0 0 1px rgba(160,240,255,.5),0 6px 22px var(--glow)}
.pill::after{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(180deg,rgba(255,255,255,.45),transparent);pointer-events:none}
.pill.dark{background:linear-gradient(180deg,#3a6ef0 0%,#1f4bbd 55%,#163a95 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 1px rgba(120,170,255,.45),0 6px 18px rgba(30,80,200,.5)}
.pill.ghost{background:linear-gradient(165deg,var(--g1),var(--g2));border:1px solid var(--rim);box-shadow:inset 0 1px 0 var(--sheen2)}
.cta{position:relative;overflow:hidden;background:linear-gradient(180deg,#b3f8ff 0%,#5ae2f3 40%,#1fb6da 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 0 1px rgba(170,245,255,.6),0 0 34px rgba(63,208,224,.55),0 14px 30px rgba(0,0,0,.35);border-radius:22px;padding:18px}
.cta::after{content:"";position:absolute;inset:0 0 52% 0;background:linear-gradient(180deg,rgba(255,255,255,.5),transparent);pointer-events:none}
.tile{padding:16px 6px 14px}
.tile .ic{width:28px;height:28px;filter:drop-shadow(0 0 6px var(--glow))}
.tile b{font-size:1.75rem;text-shadow:0 0 16px rgba(120,190,255,.35)}
.tile{min-width:0}
.tile b{max-width:100%;line-height:1.15;overflow-wrap:anywhere}
.tile b i{display:block;font-style:normal;font-size:.68rem;font-weight:700;color:var(--muted);text-shadow:none;margin-top:2px}
.wallet .v,.bigw .v{text-shadow:0 0 18px rgba(120,190,255,.35)}
.wicon{background:linear-gradient(160deg,#ffffff,#c9d6ec 45%,#8a9fc6);box-shadow:inset 0 2px 0 #fff,inset 0 -4px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.35)}

/* ---- «نقره و یخ» (انتخاب جواد، ۵ اکتبر): نقره‌ای نشان اسب‌ها برای دکمه‌ی اصلی، فیروزه‌ای یخی کم‌رنگ فقط برای
   حالت فعال و نوارها، شیشه‌ی مات و درخشش کم؛ عکس زمینه دست نخورده و نشانش دیده می‌شود. ---- */
:root,:root[data-theme="dark"],:root[data-theme="light"]{
  --bg:#050b1f; --bg2:#0b1d4a; --fg:#eef2fc; --muted:#9aa8c9; --soft:#6c7a9c;
  --ice:#8fd6ff; --iceSoft:rgba(143,214,255,.13); --silver1:#f2f5fb; --silver2:#b8c4da; --silverInk:#0b1a44;
  --cyan:var(--ice); --cyan2:var(--ice); --glow:rgba(143,214,255,.14);
  --card:rgba(10,22,60,.56); --line:rgba(190,205,245,.14);
  --ok:#5fd39a; --warn:#f0c062; --bad:#8d98b2; --track:rgba(255,255,255,.10); color-scheme:dark}
.glass{background:var(--card);border:1px solid var(--line);box-shadow:0 10px 24px rgba(0,0,0,.32);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.glass::before{opacity:.25}
.pill{background:linear-gradient(180deg,var(--silver1),var(--silver2));color:var(--silverInk);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 12px rgba(0,0,0,.28);border:0}
.pill::after{opacity:.35}
.pill.dark{background:var(--iceSoft);color:var(--ice);border:1px solid rgba(143,214,255,.22);box-shadow:none}
.pill.dark::after,.pill.ghost::after{display:none}
.pill.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none}
.cta{background:linear-gradient(180deg,var(--silver1),var(--silver2));color:var(--silverInk);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 8px 20px rgba(0,0,0,.32);border-radius:18px}
.cta::after{opacity:.3}
.tabs{background:var(--card);border:1px solid var(--line);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.tabs button[aria-selected="true"]{background:var(--iceSoft);color:var(--ice);border:1px solid transparent;box-shadow:none}
.filters button{background:transparent;border:1px solid var(--line);color:var(--fg)}
.filters button[aria-pressed="true"]{background:var(--iceSoft);color:var(--ice);border-color:transparent;box-shadow:none}
.kind[aria-pressed="true"],.plan[aria-pressed="true"]{background:var(--iceSoft);border-color:rgba(143,214,255,.45);box-shadow:none}
.kind[aria-pressed="true"] b,.plan[aria-pressed="true"] .gb{color:var(--ice)}
.amts button{background:transparent;border-color:var(--line)}
.amts button[aria-pressed="true"]{border-color:var(--ice);color:var(--ice);background:var(--iceSoft)}
.tile .ic{color:var(--ice);filter:none}
.tile b,.wallet .v,.bigw .v,.hero .en{text-shadow:none}
.iconbtn{background:var(--card);border:1px solid var(--line);box-shadow:none}
.iconbtn .badge{background:var(--ice);box-shadow:0 0 0 2px var(--bg)}
.dbar i{background:var(--ice);box-shadow:none}
.sw[aria-checked="true"]{background:#3fbf83;box-shadow:none;border-color:transparent}
.sw{background:#5b6680;box-shadow:none;border-color:transparent}
.dot.ok{box-shadow:none}.dot.warn{box-shadow:none}
.sech button{color:var(--ice)}
.bgart.dim{opacity:.55}
.toast{background:var(--silver1);color:var(--silverInk)}
.sheet{background:#081333;border-color:var(--line)}
.ic[viewBox] path[fill="currentColor"]{stroke:none}
